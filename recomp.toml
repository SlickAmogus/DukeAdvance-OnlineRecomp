# Entries into the unrolled block copy at 0x03007070 (computed jump targets).
[[extra_func]]
addr = 0x03007100
mode = "arm"
name = "iwram_copy_entry_7100"
[[extra_func]]
addr = 0x03007108
mode = "arm"
name = "iwram_copy_entry_7108"

# 0x0801FABC is called for every wall segment the game is about to draw. The
# native renderer only observes this entry (the function always runs): from
# the first segment to the end of the scene pass the game's emulated CPU time
# is discounted, because the pixels it draws are not shown. (The pass is not
# discounted from its very start: before the first segment the game waits for
# the pending page flip, and that wait must run in real time.)
[[mod_function_hook]]
addr = 0x0801FABC
mode = "thumb"
note = "wall segment about to be drawn (observed only)"

# 0x0801BDCC is the game's player update (movement, turning, look pitch), run
# once per game tick. Mouse aim only observes this entry: it adds the mouse
# movement gathered since the last tick to the player's angle and pitch here,
# immediately before the game reads them. (Writing them at display-frame
# boundaries instead lands at an arbitrary point of the tick, and in some
# scenes the game then overwrites the change every frame.)
[[mod_function_hook]]
addr = 0x0801BDCC
mode = "thumb"
note = "player update: mouse aim applied here (observed only)"

# 0x08013924 is the game's shared menu input handler (r0 = the menu being
# shown), run once per frame while any of its menus is on screen. Only
# observed: it tells the PC mouse code that a menu is live and which one.
[[mod_function_hook]]
addr = 0x08013924
mode = "thumb"
note = "menu input handler: marks a menu as live for mouse pointing (observed only)"

# 0x08016794 is the options list's own input handler (same argument, same
# selection state as 0x08013924). Observed for the same reason.
[[mod_function_hook]]
addr = 0x08016794
mode = "thumb"
note = "options menu input handler: marks the menu as live for mouse pointing (observed only)"

