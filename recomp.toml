# gba_recompile base config for Duke Nukem Advance (AD9P, Europe).
# Schema: ../gbarecomp/docs/TOML_SCHEMA.md. Machine-found seeds live in the
# overlay recomp_scan.toml (tools/scan_seeds.py); reviewed entries go here.

[program]
name         = "Duke Nukem Advance"
id           = "dukeadvance"
load_address = 0x08000000
size         = 0x00800000
entry_pc     = 0x08000000
# Executable part of the cartridge: crt0 through the last libc routine. A sine
# table and assets follow at 0x080308D0.
aot_scan_start = 0x080000C0
aot_scan_end   = 0x080308D0

[identity]
sha1 = "f01522ee46f5aa821adbba0a97b1a745ff9059f5"

[[extra_func]]
addr = 0x080000C8
mode = "arm"
name = "crt0_start"
note = "target of the header branch at 0x08000000"

[[code_copy]]
runtime_start = 0x03003150
source_start  = 0x087FA21C
size          = 0x0000411C
name          = "iwram_image"
note          = "crt0 (0x08000130) DMA3-copies .iwram: renderer/mixer ARM code plus initialised data"

# Four small ARM routines the game DMA-copies into low IWRAM when it needs
# them (link/sound code: each pool holds DMA0 SAD, source, dest, control).
# Single player only ever interpreted them; netplay has no interpreter.
[[code_copy]]
runtime_start = 0x03000344
source_start  = 0x0802DAC4
size          = 0x00000058
name          = "iwram_low_344"
note          = "DMA0 from the pool at 0x0802CFF0"

[[code_copy]]
runtime_start = 0x0300039C
source_start  = 0x0802DB3C
size          = 0x0000026C
name          = "iwram_low_39C"
note          = "DMA0 from the pool at 0x0802DB2C"

[[code_copy]]
runtime_start = 0x03000608
source_start  = 0x0802D990
size          = 0x00000134
name          = "iwram_low_608"
note          = "DMA0 from the pool at 0x0802D980"

[[code_copy]]
runtime_start = 0x0300073C
source_start  = 0x0802D3F8
size          = 0x0000017C
name          = "iwram_low_73C"
note          = "DMA0 from the pool at 0x0802D3E8"

[[extra_func]]
addr = 0x03000344
mode = "arm"
name = "iwram_low_344"
[[extra_func]]
addr = 0x0300039C
mode = "arm"
name = "iwram_low_39C"
[[extra_func]]
addr = 0x03000608
mode = "arm"
name = "iwram_low_608"
[[extra_func]]
addr = 0x0300073C
mode = "arm"
name = "iwram_low_73C"

# Mouse look (src/pc_controls.cpp). The player update at 0x0801C3E0 pulls the
# look pitch (IWRAM 0x03002F10) back to zero every tick:
#   0801C3E4  cmp r1,#0 ; ble -> skip the "pitch > 0" decay
#   0801C3FA  cmp r1,#0 ; bge -> skip the "pitch < 0" decay
# These two compares may take a game-supplied operand so both decays can be
# skipped while mouse aim is enabled. With the hook unset they are unchanged.
[[thumb_alu_immediate_override]]
addr = 0x0801C3E4
note = "pitch recentre guard (positive side)"

[[thumb_alu_immediate_override]]
addr = 0x0801C3FA
note = "pitch recentre guard (negative side)"

# Native renderer seam (src/scene_host.cpp). 0x08022EF8 is the sprite drawer,
# the last step of the game's scene pass. While the native renderer is on the
# hook replaces it by clearing the bitmap page, so that everything the game
# draws afterwards (weapon, messages) can be told apart from the 3D view. With
# the hook disabled or declining, the original function runs unchanged.
[[mod_function_hook]]
addr = 0x08022EF8
mode = "thumb"
note = "end of scene pass: native renderer overlay separation"

# 0x0801F960 draws one floor/ceiling plane (pure pixel work). The native
# renderer replaces it with a no-op while it is on, which is most of what
# lets the game finish a frame every display refresh.
[[mod_function_hook]]
addr = 0x0801F960
mode = "thumb"
note = "floor/ceiling plane drawer: skipped under the native renderer"

# The IWRAM wall rasterisers specialise themselves per wall: fifteen
# instruction slots are switched between an unconditional branch (skip an
# optional block) and a no-op, and a few MOV/AND/CMP operands are rewritten
# (patches/0003 teaches the recompiler's RAM templates both forms). The code
# after each slot is only reachable in the no-op form, so it is seeded here.
[[extra_func]]
addr = 0x0300349C
mode = "arm"
name = "iwram_after_slot_3498"
[[extra_func]]
addr = 0x03006550
mode = "arm"
name = "iwram_after_slot_654C"
[[extra_func]]
addr = 0x030065A4
mode = "arm"
name = "iwram_after_slot_65A0"
